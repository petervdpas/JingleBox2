name: winget

# Sends each release to winget as a pull request against microsoft/winget-pkgs.
#
# Two ways, decided by whether winget-pkgs has the package yet. Once it has, winget-releaser works
# the manifest out from the release itself. Before that, winget-releaser cannot help, since it can
# only update a package that exists, so the committed manifest in packaging/winget/manifest is
# submitted with wingetcreate instead. That manifest has to name the release being sent:
# packaging/winget/update.sh points it at one, and a manifest naming another version is refused
# rather than submitted.
#
# Triggered by the release workflow finishing rather than by the release being published: a
# release made with the workflow's own token does not start other workflows.
#
# Needs a repository secret WINGET_TOKEN, a classic personal access token with public_repo, and
# a fork of microsoft/winget-pkgs under the same account. Without the secret it says so in a
# warning and sends nothing, and the run is not marked failed: a missing secret is a setup step
# not taken yet, and a red run on every release would say something is broken when nothing is.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to send, for example v2.6.8
        required: true

jobs:
  winget:
    name: Submit to winget
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Tag
        id: tag
        shell: bash
        env:
          FROM_INPUT: ${{ github.event.inputs.tag }}
          FROM_RUN: ${{ github.event.workflow_run.head_branch }}
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          set -euo pipefail
          TAG="${FROM_INPUT:-$FROM_RUN}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "ERROR: '$TAG' is not a release tag"; exit 1 ;;
          esac
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning title=Not sent to winget::there is no WINGET_TOKEN secret, so $TAG was not sent to winget-pkgs"
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -fsIL -o /dev/null "https://github.com/microsoft/winget-pkgs/tree/master/manifests/p/PetervdPas/JingleBox2"; then
            echo "send=update" >> "$GITHUB_OUTPUT"
          else
            echo "send=new" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.tag.outputs.send == 'new'
        with:
          ref: master

      - name: Submit the first version
        if: steps.tag.outputs.send == 'new'
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'packaging/winget/manifest'
          $named = (Select-String -Path "$dir/PetervdPas.JingleBox2.yaml" -Pattern '^PackageVersion:\s*(\S+)').Matches[0].Groups[1].Value
          if ($named -ne $env:VERSION) {
            Write-Output "::error title=Not sent to winget::the manifest in $dir names $named, not $env:VERSION; run packaging/winget/update.sh v$env:VERSION, push, and run this again"
            exit 1
          }
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.tag.outputs.send == 'update'
        with:
          identifier: PetervdPas.JingleBox2
          version: ${{ steps.tag.outputs.version }}
          release-tag: ${{ steps.tag.outputs.tag }}
          installers-regex: 'JingleBox2-Setup-[0-9.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
