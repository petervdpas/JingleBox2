name: flatpak

# Builds the Flatpak from the commit it is run on and leaves a jinglebox2-<version>-<arch>.flatpak
# file on the run's page, as the artifact flatpak-<arch>, to download and install with
# "flatpak install --user <file>".
#
# Started by hand from the Actions tab, or called by release.yml on a tag, which attaches the two
# bundles to the release once it is published. Called that way it is optional: it runs beside the
# other packages, nothing waits on it, and a Flatpak that fails to build does not fail the release
# run. That last part matters beyond the release page, because winget.yml only sends a version to
# winget when the release run as a whole succeeded.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      optional:
        description: A failed build does not fail the run that called this.
        type: boolean
        default: false

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ inputs.optional == true }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # There is no git inside a Flatpak build, so the newest tag's version is written beside the
      # manifest here, by the same step a local build runs, and the manifest's publish reads it.
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/flatpak/build.sh version
          echo "version=$(cat packaging/flatpak/version)" >> "$GITHUB_OUTPUT"

      # Every NuGet package the publish needs, restored by the same .NET SDK the build will use,
      # so the runtime packs it lists are the ones the offline publish asks for.
      # HOME is moved for this step alone. The generator runs dotnet restore inside the SDK with
      # the caller's environment, and .NET writes its first-run folder and NuGet's into HOME. The
      # container's /github/home belongs to the runner's own user, so inside the sandbox that is
      # "Access to the path '/github/home/.dotnet' is denied", nothing is restored, and the list
      # comes out empty. /tmp is the sandbox's own and always writable. The SDK is installed
      # system wide here, so flatpak does not need HOME to find it.
      - name: NuGet sources
        shell: bash
        env:
          JB_FLATPAK_SCOPE: --system
          JB_FLATPAK_WORK: /tmp/flatpak-work
          HOME: /tmp/flatpak-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          bash packaging/flatpak/build.sh sources

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.petervdpas.JingleBox2.yml
          bundle: jinglebox2-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/nuget-sources.json') }}
          # A name the release can ask for exactly, rather than one made from the bundle's.
          artifact-name: flatpak-${{ matrix.arch }}
