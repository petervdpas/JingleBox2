name: release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64

          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

          - name: linux-arm64
            os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    env:
      APP_NAME: JingleBox2
      CONFIGURATION: Release
      PROJECT_PATH: ./JingleBox2.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      # ---------- Linux deps (arm64 only) ----------
      - name: Install ARM64 build deps (Linux arm64 only)
        if: matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # --------------------
      # Publish (Windows) - IMPORTANT: no single-file, so bass.dll stays next to exe
      # --------------------
      - name: Publish (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o "out/${{ matrix.name }}"

      - name: Verify bass.dll exists (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          $p = "out\${{ matrix.name }}\bass.dll"
          if (!(Test-Path $p)) { throw "bass.dll missing at $p" }
          Write-Host "OK: bass.dll present"
          Get-ChildItem "out\${{ matrix.name }}" | Select-Object Name,Length | Format-Table -AutoSize

      # --------------------
      # Publish (Linux)
      # --------------------
      - name: Publish (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          EXTRA_PROPS=""
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            # Clear any forced x64 PlatformTarget in the csproj/solution
            EXTRA_PROPS="-p:PlatformTarget=AnyCPU"
          fi

          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            $EXTRA_PROPS \
            -o "out/${{ matrix.name }}"

      # --------------------
      # Windows installer via Inno Setup
      # --------------------
      - name: Install Inno Setup
        if: startsWith(matrix.os, 'windows')
        run: choco install innosetup -y

      - name: Build installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          iscc installer/windows/JingleBox2.iss

      # --------------------
      # Package Linux artifacts (tar.gz)
      # --------------------
      - name: Create tar.gz (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          cd "out/${{ matrix.name }}"
          tar -czf "../../${APP_NAME}-${{ matrix.name }}.tar.gz" .
          cd ../..

      # --------------------
      # Package Windows portable zip
      # --------------------
      - name: Create zip (Windows portable)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Compress-Archive -Path "out/${{ matrix.name }}\*" -DestinationPath "$env:APP_NAME-${{ matrix.name }}.zip"

      # --------------------
      # Upload artifacts (per leg)
      # --------------------
      - name: Upload artifacts (Windows)
        if: startsWith(matrix.rid, 'win')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-windows-x64.zip
            installer/windows/output/*.exe

      - name: Upload artifacts (Linux)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-${{ matrix.name }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    # IMPORTANT: only create a GitHub Release when this run is for a tag push.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -maxdepth 6 -print

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -maxdepth 6 -exec cp "{}" dist/ \;
          echo "Dist contents:"
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
