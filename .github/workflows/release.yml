name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64

          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

          - name: linux-arm64
            os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    env:
      APP_NAME: JingleBox2
      CONFIGURATION: Release
      PROJECT_PATH: ./JingleBox2.csproj

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Install ARM64 build deps (Linux arm64 only)
        if: matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o "out/${{ matrix.name }}"

      - name: Verify bass.dll exists (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Write-Host "Publish output:"
          Get-ChildItem "out\${{ matrix.name }}" | Select-Object Name,Length | Format-Table -AutoSize
          $p = "out\${{ matrix.name }}\bass.dll"
          if (!(Test-Path $p)) { throw "bass.dll missing at $p" }
          Write-Host "OK: bass.dll present"

      - name: Publish (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          EXTRA_PROPS=""
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            EXTRA_PROPS="-p:PlatformTarget=AnyCPU"
          fi

          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            $EXTRA_PROPS \
            -o "out/${{ matrix.name }}"

      - name: Install Inno Setup
        if: startsWith(matrix.os, 'windows')
        run: choco install innosetup -y

      - name: Build installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          iscc installer/windows/JingleBox2.iss

      - name: Create tar.gz (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          cd "out/${{ matrix.name }}"
          tar -czf "../../${APP_NAME}-${{ matrix.name }}.tar.gz" .
          cd ../..

      - name: Create zip (Windows portable)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Compress-Archive -Path "out\${{ matrix.name }}\*" -DestinationPath "$env:APP_NAME-${{ matrix.name }}.zip"

      - name: Upload artifacts (Windows)
        if: startsWith(matrix.rid, 'win')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-windows-x64.zip
            installer/windows/output/*.exe

      - name: Upload artifacts (Linux)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-${{ matrix.name }}.tar.gz

  rpm_fedora:
    name: Fedora RPM (x64, self-contained)
    runs-on: ubuntu-latest
    container:
      image: fedora:41

    env:
      APP_NAME: JingleBox2
      CONFIGURATION: Release
      PROJECT_PATH: ./JingleBox2.csproj

    steps:
      - name: Install build tooling
        run: |
          dnf -y update
          dnf -y install git rpm-build rpmdevtools tar gzip findutils
          dnf -y install dotnet-sdk-9.0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        run: dotnet restore

      - name: Publish (linux-x64 self-contained, NOT single-file)
        run: |
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -o out/linux-x64

      - name: Prepare RPM sources
        shell: bash
        run: |
          set -euo pipefail

          echo "whoami=$(whoami)"
          echo "HOME=$HOME"
          echo "PWD=$(pwd)"

          # Force rpmbuild topdir to the SAME place rpmbuild uses in the logs
          RPMTOP="/github/home/rpmbuild"
          mkdir -p "$RPMTOP"
          rpmdev-setuptree

          VER="${GITHUB_REF_NAME#v}"
          PKGROOT="jinglebox2-${VER}"
          TARBALL="jinglebox2-${VER}.tar.gz"

          # Stage content
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$PKGROOT/payload"
          mkdir -p "$STAGE/$PKGROOT/packaging/fedora/icons"

          cp -a out/linux-x64/. "$STAGE/$PKGROOT/payload/"
          cp -a packaging/fedora/jinglebox2.sh "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/jinglebox2.desktop "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/icons/jinglebox2.png "$STAGE/$PKGROOT/packaging/fedora/icons/"
          cp -a packaging/fedora/jinglebox2.spec "$RPMTOP/SPECS/jinglebox2.spec"
          cp -a LICENSE "$STAGE/$PKGROOT/" || true

          # Create Source0 where rpmbuild expects it
          tar -C "$STAGE" -czf "$RPMTOP/SOURCES/$TARBALL" "$PKGROOT"

          echo "== SOURCES =="
          ls -la "$RPMTOP/SOURCES"
          test -f "$RPMTOP/SOURCES/$TARBALL"
          echo "OK: created $RPMTOP/SOURCES/$TARBALL"

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail

          RPMTOP="/github/home/rpmbuild"
          VER="${GITHUB_REF_NAME#v}"

          echo "Building with _topdir=$RPMTOP version=$VER"
          rpmbuild -ba "$RPMTOP/SPECS/jinglebox2.spec" \
            --define "_topdir ${RPMTOP}" \
            --define "version ${VER}"

      - name: Collect RPM
        run: |
          mkdir -p dist
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-fedora-rpm-x64
          path: dist/*.rpm

  release:
    name: Publish GitHub Release
    needs: [build, rpm_fedora]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -maxdepth 8 -exec cp "{}" dist/ \;
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
