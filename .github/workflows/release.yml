name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: JingleBox2
  CONFIGURATION: Release
  PROJECT_PATH: ./JingleBox2.csproj
  DEB_PKG_NAME: jinglebox2

jobs:
  # Before anything is packaged. A release is the one build nobody gets to take back, so the
  # tests run first and everything that makes an artefact waits on them.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install ALSA runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libasound2-dev

      - name: Restore
        run: dotnet restore JingleBox2.sln

      - name: Test
        run: dotnet test Tests/JingleBox2.Tests.csproj -c Debug --logger "trx;LogFileName=results.trx"

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  build:
    name: Build & Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64

          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

          - name: linux-arm64
            os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Ensure ALSA runtime is present on Ubuntu runners (24.04 uses libasound2t64)
      - name: Install ALSA runtime (Linux runners)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libasound2-dev

      - name: Restore
        run: dotnet restore

      - name: Publish (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:Version=$ver `
            -o "out/${{ matrix.name }}"

      - name: Verify bass.dll exists (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Write-Host "Publish output:"
          Get-ChildItem "out\${{ matrix.name }}" | Select-Object Name,Length | Format-Table -AutoSize
          $p = "out\${{ matrix.name }}\bass.dll"
          if (!(Test-Path $p)) { throw "bass.dll missing at $p" }
          Write-Host "OK: bass.dll present"
          $p2 = "out\${{ matrix.name }}\bass_aac.dll"
          if (!(Test-Path $p2)) { Write-Host "WARNING: bass_aac.dll missing (AAC streams won't work)" }
          else { Write-Host "OK: bass_aac.dll present" }
          # RECORD's monitor entries come from this one. It is in native/win-x64, so its absence
          # here is the copy having gone wrong rather than a build without the feature.
          $p3 = "out\${{ matrix.name }}\basswasapi.dll"
          if (!(Test-Path $p3)) { throw "basswasapi.dll missing at $p3 (RECORD would have no monitors)" }
          Write-Host "OK: basswasapi.dll present"
          # ASIO is the low-latency output. Optional in the same way bass_aac is: without it the
          # output list has no drivers in it and SETTINGS says why, which is a smaller feature set
          # rather than a break. It is copied by its own line in the csproj, and a copy target that
          # names each file one by one is exactly the kind that gets a new file forgotten.
          $p4 = "out\${{ matrix.name }}\bassasio.dll"
          if (!(Test-Path $p4)) { Write-Host "WARNING: bassasio.dll missing (no ASIO output)" }
          else { Write-Host "OK: bassasio.dll present" }
          $p5 = "out\${{ matrix.name }}\bassmix.dll"
          if (!(Test-Path $p5)) { throw "bassmix.dll missing: nothing would be summed into one output" }
          else { Write-Host "OK: bassmix.dll present" }

      - name: Publish (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:Version="$VER" \
            -o "out/${{ matrix.name }}"

      - name: Fix Linux payload (BASS + remove .NET lttng tracepoints)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.name }}"

          if [ -f "$OUT/runtimes/${{ matrix.rid }}/native/libbass.so" ]; then
            cp -a "$OUT/runtimes/${{ matrix.rid }}/native/libbass.so" "$OUT/libbass.so"
          fi
          if [ -f "$OUT/runtimes/${{ matrix.rid }}/native/libbass_aac.so" ]; then
            cp -a "$OUT/runtimes/${{ matrix.rid }}/native/libbass_aac.so" "$OUT/libbass_aac.so"
          fi

          rm -f "$OUT/libcoreclrtraceptprovider.so"

          test -f "$OUT/${APP_NAME}"

      - name: Verify machines are packaged (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.name }}"
          bash .github/scripts/verify-machines.sh "$OUT"

      - name: Verify machines are packaged (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          $out = "out\${{ matrix.name }}"
          $expJson = @(Get-ChildItem -Recurse -File -Path "machines" -Filter *.json).Count
          $expWav  = @(Get-ChildItem -Recurse -File -Path "machines" -Filter *.wav).Count
          $actJson = 0
          $actWav  = 0
          if (Test-Path "$out\machines") {
            $actJson = @(Get-ChildItem -Recurse -File -Path "$out\machines" -Filter *.json).Count
            $actWav  = @(Get-ChildItem -Recurse -File -Path "$out\machines" -Filter *.wav).Count
          }
          Write-Host "machines: $actJson/$expJson json, $actWav/$expWav wav"
          if ($expJson -eq 0) { throw "No machines in the source tree; the check itself is broken" }
          if ($actJson -ne $expJson -or $actWav -ne $expWav) {
            Get-ChildItem -Recurse -File -Path "$out\machines" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Machines missing from $out\machines"
          }
          Write-Host "OK: machines present"

      - name: Install Inno Setup
        if: startsWith(matrix.os, 'windows')
        run: choco install innosetup -y

      - name: Build installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          iscc /DAppVersion=$version installer/windows/JingleBox2.iss

      - name: Create tar.gz (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          cd "out/${{ matrix.name }}"
          tar -czf "../../${APP_NAME}-${{ matrix.name }}.tar.gz" .
          cd ../..

      - name: Create zip (Windows portable)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Compress-Archive -Path "out\${{ matrix.name }}\*" -DestinationPath "$env:APP_NAME-${{ matrix.name }}.zip"

      - name: Upload artifacts (Windows)
        if: startsWith(matrix.rid, 'win')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-windows-x64.zip
            installer/windows/output/*.exe

      - name: Upload artifacts (Linux)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-${{ matrix.name }}.tar.gz

  rpm_fedora:
    name: Fedora RPM (x64, Fedora ${{ matrix.fedora }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    container:
      image: fedora:${{ matrix.fedora }}

    steps:
      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install ca-certificates git rpm-build rpmdevtools tar gzip findutils sed grep coreutils
          # ALSA runtime + devel so managed-midi finds libasound.so
          dnf -y install alsa-lib alsa-lib-devel
          update-ca-trust || true
          dnf -y install dotnet-sdk-10.0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish (linux-x64 self-contained, NOT single-file)
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:Version="$VER" \
            -o out/linux-x64

      - name: Fix Fedora payload (BASS + remove .NET lttng tracepoints)
        shell: bash
        run: |
          set -euo pipefail

          if [ -f out/linux-x64/runtimes/linux-x64/native/libbass.so ]; then
            cp -a out/linux-x64/runtimes/linux-x64/native/libbass.so out/linux-x64/libbass.so
          fi
          if [ -f out/linux-x64/runtimes/linux-x64/native/libbass_aac.so ]; then
            cp -a out/linux-x64/runtimes/linux-x64/native/libbass_aac.so out/linux-x64/libbass_aac.so
          fi

          rm -f out/linux-x64/libcoreclrtraceptprovider.so

          test -f out/linux-x64/JingleBox2

      - name: Verify machines are packaged
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/verify-machines.sh out/linux-x64

      - name: Prepare RPM sources (patch spec Version + create matching Source0)
        shell: bash
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME#v}"
          RPMTOP="/github/home/rpmbuild"

          mkdir -p "$RPMTOP"
          rpmdev-setuptree

          cp -a packaging/fedora/jinglebox2.spec "$RPMTOP/SPECS/jinglebox2.spec"
          sed -i -E "s/^Version:[[:space:]]*.*/Version:        ${VER}/" "$RPMTOP/SPECS/jinglebox2.spec"

          NAME="$(awk '/^Name:[[:space:]]*/{print $2; exit}' "$RPMTOP/SPECS/jinglebox2.spec")"
          if [ -z "${NAME:-}" ]; then
            echo "ERROR: Could not parse Name: from spec"
            exit 1
          fi

          PKGROOT="${NAME}-${VER}"
          TARBALL="${NAME}-${VER}.tar.gz"

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$PKGROOT/payload"
          mkdir -p "$STAGE/$PKGROOT/packaging/fedora/icons"

          cp -a out/linux-x64/. "$STAGE/$PKGROOT/payload/"
          cp -a packaging/fedora/jinglebox2.sh "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/jinglebox2.desktop "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/icons/jinglebox2.png "$STAGE/$PKGROOT/packaging/fedora/icons/"
          cp -a LICENSE "$STAGE/$PKGROOT/" || true

          tar -C "$STAGE" -czf "$RPMTOP/SOURCES/$TARBALL" "$PKGROOT"

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          RPMTOP="/github/home/rpmbuild"
          rpmbuild -ba "$RPMTOP/SPECS/jinglebox2.spec" --define "_topdir ${RPMTOP}"

      # Every Fedora here, not the newest one by name. The tracepoint provider is removed
      # from the payload unconditionally a few steps up, so the check belongs on every build
      # that fix is applied to. Named after one release it becomes a check that silently stops
      # covering the version most likely to need it: the next one, which is the one that drops
      # the old liblttng-ust from its repositories.
      - name: Sanity-check RPM dependencies (must not require liblttng-ust.so.0)
        shell: bash
        run: |
          set -euo pipefail

          if rpm -qpR /github/home/rpmbuild/RPMS/*/*.rpm | grep -q 'liblttng-ust\.so\.0'; then
            echo "ERROR: the Fedora ${{ matrix.fedora }} RPM still requires liblttng-ust.so.0"
            exit 1
          fi

      - name: Verify machines inside the RPM
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(find machines -type f \( -name '*.json' -o -name '*.wav' \) | wc -l | tr -d '[:space:]')"
          ACTUAL="$(rpm -qpl /github/home/rpmbuild/RPMS/*/*.rpm | grep -c '^/opt/JingleBox2/machines/.*\.\(json\|wav\)$' || true)"
          echo "machines in RPM: $ACTUAL/$EXPECTED"
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: the RPM does not carry every machine file"
            exit 1
          fi

      - name: Collect RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find /github/home/rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-fedora${{ matrix.fedora }}-rpm-x64
          path: dist/*.rpm

  deb_ubuntu:
    name: Ubuntu/Debian .deb (amd64, self-contained)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install packaging tools (+ ALSA runtime)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg dpkg-dev fakeroot tar gzip \
            libasound2t64 libasound2-dev

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish (linux-x64 self-contained, not single-file)
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:Version="$VER" \
            -o "out/linux-x64"

      - name: Fix DEB payload (BASS + remove .NET lttng tracepoints)
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/linux-x64"

          if [ -f "$OUT/runtimes/linux-x64/native/libbass.so" ]; then
            cp -a "$OUT/runtimes/linux-x64/native/libbass.so" "$OUT/libbass.so"
          fi
          if [ -f "$OUT/runtimes/linux-x64/native/libbass_aac.so" ]; then
            cp -a "$OUT/runtimes/linux-x64/native/libbass_aac.so" "$OUT/libbass_aac.so"
          fi

          rm -f "$OUT/libcoreclrtraceptprovider.so"

          test -f "$OUT/${APP_NAME}"

      - name: Verify machines are packaged
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/verify-machines.sh out/linux-x64

      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME#v}"
          ARCH="amd64"
          NAME="$DEB_PKG_NAME"

          ROOT="$(mktemp -d)"
          PKGDIR="$ROOT/${NAME}_${VER}_${ARCH}"

          mkdir -p "$PKGDIR/DEBIAN"
          mkdir -p "$PKGDIR/opt/${APP_NAME}"
          mkdir -p "$PKGDIR/usr/bin"
          mkdir -p "$PKGDIR/usr/share/applications"
          mkdir -p "$PKGDIR/usr/share/icons/hicolor/256x256/apps"

          cp -a "out/linux-x64/." "$PKGDIR/opt/${APP_NAME}/"
          chmod 0755 "$PKGDIR/opt/${APP_NAME}/${APP_NAME}" || true

          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec /opt/%s/%s "$@"\n' \
            "$APP_NAME" "$APP_NAME" \
            > "$PKGDIR/usr/bin/$NAME"
          chmod 0755 "$PKGDIR/usr/bin/$NAME"

          printf '[Desktop Entry]\nType=Application\nName=JingleBox2\nComment=Audio pad launcher\nExec=/usr/bin/%s\nIcon=%s\nTerminal=false\nCategories=Audio;AudioVideo;\n' \
            "$NAME" "$NAME" \
            > "$PKGDIR/usr/share/applications/$NAME.desktop"

          if [ -f packaging/fedora/icons/jinglebox2.png ]; then
            cp -a packaging/fedora/icons/jinglebox2.png \
              "$PKGDIR/usr/share/icons/hicolor/256x256/apps/$NAME.png"
          fi

          INSTALLED_SIZE="$(du -sk "$PKGDIR/opt/${APP_NAME}" | awk '{print $1}')"

          # Ubuntu 24.04: libasound2 is virtual; depend on libasound2t64 (or libasound2 on older distros)
          printf 'Package: %s\nVersion: %s\nSection: sound\nPriority: optional\nArchitecture: %s\nMaintainer: JingleBox2 CI <noreply@github.com>\nInstalled-Size: %s\nDepends: libasound2t64 | libasound2\nDescription: JingleBox2\n Lightweight cross-platform audio pad launcher built with .NET and Avalonia UI.\n' \
            "$NAME" "$VER" "$ARCH" "$INSTALLED_SIZE" \
            > "$PKGDIR/DEBIAN/control"

          mkdir -p dist
          fakeroot dpkg-deb --build "$PKGDIR" "dist/${NAME}_${VER}_${ARCH}.deb"
          ls -la dist

      - name: Verify machines inside the .deb
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(find machines -type f \( -name '*.json' -o -name '*.wav' \) | wc -l | tr -d '[:space:]')"
          ACTUAL="$(dpkg-deb -c dist/*.deb | grep -c ' \./opt/JingleBox2/machines/.*\.\(json\|wav\)$' || true)"
          echo "machines in .deb: $ACTUAL/$EXPECTED"
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: the .deb does not carry every machine file"
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-deb-amd64
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: [build, rpm_fedora, deb_ubuntu]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -maxdepth 8 -type f -exec cp -v "{}" dist/ \;
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
