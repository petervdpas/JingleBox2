name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64

          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

          - name: linux-arm64
            os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    env:
      APP_NAME: JingleBox2
      CONFIGURATION: Release
      PROJECT_PATH: ./JingleBox2.csproj

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Install ARM64 build deps (Linux arm64 only)
        if: matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o "out/${{ matrix.name }}"

      - name: Verify bass.dll exists (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Write-Host "Publish output:"
          Get-ChildItem "out\${{ matrix.name }}" | Select-Object Name,Length | Format-Table -AutoSize
          $p = "out\${{ matrix.name }}\bass.dll"
          if (!(Test-Path $p)) { throw "bass.dll missing at $p" }
          Write-Host "OK: bass.dll present"

      - name: Publish (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_PROPS=""
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            EXTRA_PROPS="-p:PlatformTarget=AnyCPU"
          fi

          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            $EXTRA_PROPS \
            -o "out/${{ matrix.name }}"

      - name: Fix Linux native libs (BASS + remove .NET lttng tracepoints)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.name }}"

          if [ -f "$OUT/runtimes/${{ matrix.rid }}/native/libbass.so" ]; then
            cp -a "$OUT/runtimes/${{ matrix.rid }}/native/libbass.so" "$OUT/libbass.so"
          fi

          rm -f "$OUT/libcoreclrtraceptprovider.so"

          test -f "$OUT/${APP_NAME}"

      - name: Install Inno Setup
        if: startsWith(matrix.os, 'windows')
        run: choco install innosetup -y

      - name: Build installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          iscc installer/windows/JingleBox2.iss

      - name: Create tar.gz (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          cd "out/${{ matrix.name }}"
          tar -czf "../../${APP_NAME}-${{ matrix.name }}.tar.gz" .
          cd ../..

      - name: Create zip (Windows portable)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Compress-Archive -Path "out\${{ matrix.name }}\*" -DestinationPath "$env:APP_NAME-${{ matrix.name }}.zip"

      - name: Upload artifacts (Windows)
        if: startsWith(matrix.rid, 'win')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-windows-x64.zip
            installer/windows/output/*.exe

      - name: Upload artifacts (Linux)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-${{ matrix.name }}.tar.gz

  rpm_fedora:
    name: Fedora RPM (x64, Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [41, 43]
    container:
      image: fedora:${{ matrix.fedora }}

    env:
      APP_NAME: JingleBox2
      CONFIGURATION: Release
      PROJECT_PATH: ./JingleBox2.csproj

    steps:
      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install git rpm-build rpmdevtools tar gzip findutils sed grep coreutils
          dnf -y install dotnet-sdk-9.0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish (linux-x64 self-contained, NOT single-file)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -o out/linux-x64

      - name: Fix Fedora payload (BASS + remove .NET lttng tracepoints)
        shell: bash
        run: |
          set -euo pipefail

          if [ -f out/linux-x64/runtimes/linux-x64/native/libbass.so ]; then
            cp -a out/linux-x64/runtimes/linux-x64/native/libbass.so out/linux-x64/libbass.so
          fi

          rm -f out/linux-x64/libcoreclrtraceptprovider.so

          test -f out/linux-x64/JingleBox2

      - name: Prepare RPM sources (patch spec Version + create matching Source0)
        shell: bash
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME#v}"
          RPMTOP="/github/home/rpmbuild"

          mkdir -p "$RPMTOP"
          rpmdev-setuptree

          cp -a packaging/fedora/jinglebox2.spec "$RPMTOP/SPECS/jinglebox2.spec"
          sed -i -E "s/^Version:[[:space:]]*.*/Version:        ${VER}/" "$RPMTOP/SPECS/jinglebox2.spec"

          NAME="$(awk '/^Name:[[:space:]]*/{print $2; exit}' "$RPMTOP/SPECS/jinglebox2.spec")"
          if [ -z "${NAME:-}" ]; then
            echo "ERROR: Could not parse Name: from spec"
            exit 1
          fi

          PKGROOT="${NAME}-${VER}"
          TARBALL="${NAME}-${VER}.tar.gz"

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$PKGROOT/payload"
          mkdir -p "$STAGE/$PKGROOT/packaging/fedora/icons"

          cp -a out/linux-x64/. "$STAGE/$PKGROOT/payload/"
          cp -a packaging/fedora/jinglebox2.sh "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/jinglebox2.desktop "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/icons/jinglebox2.png "$STAGE/$PKGROOT/packaging/fedora/icons/"
          cp -a LICENSE "$STAGE/$PKGROOT/" || true

          tar -C "$STAGE" -czf "$RPMTOP/SOURCES/$TARBALL" "$PKGROOT"

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          RPMTOP="/github/home/rpmbuild"
          rpmbuild -ba "$RPMTOP/SPECS/jinglebox2.spec" --define "_topdir ${RPMTOP}"

      - name: Sanity-check RPM dependencies (Fedora 43 must not require liblttng-ust.so.0)
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.fedora }}" = "43" ]; then
            if rpm -qpR /github/home/rpmbuild/RPMS/*/*.rpm | grep -q 'liblttng-ust\.so\.0'; then
              echo "ERROR: Fedora 43 RPM still requires liblttng-ust.so.0"
              exit 1
            fi
          fi

      - name: Collect RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find /github/home/rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-fedora${{ matrix.fedora }}-rpm-x64
          path: dist/*.rpm

  deb_ubuntu:
    name: Ubuntu/Debian .deb (${{ matrix.deb_arch }}, self-contained)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            deb_arch: amd64

    env:
      APP_NAME: JingleBox2
      CONFIGURATION: Release
      PROJECT_PATH: ./JingleBox2.csproj
      DEB_PKG_NAME: jinglebox2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg dpkg-dev fakeroot tar gzip

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish (self-contained, not single-file)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -o "out/${{ matrix.rid }}"

      - name: Fix DEB payload (BASS + remove .NET lttng tracepoints)
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.rid }}"

          if [ -f "$OUT/runtimes/${{ matrix.rid }}/native/libbass.so" ]; then
            cp -a "$OUT/runtimes/${{ matrix.rid }}/native/libbass.so" "$OUT/libbass.so"
          fi

          rm -f "$OUT/libcoreclrtraceptprovider.so"

          test -f "$OUT/${APP_NAME}"

      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.deb_arch }}"
          NAME="$DEB_PKG_NAME"

          ROOT="$(mktemp -d)"
          PKGDIR="$ROOT/${NAME}_${VER}_${ARCH}"

          mkdir -p "$PKGDIR/DEBIAN"
          mkdir -p "$PKGDIR/opt/${APP_NAME}"
          mkdir -p "$PKGDIR/usr/bin"
          mkdir -p "$PKGDIR/usr/share/applications"
          mkdir -p "$PKGDIR/usr/share/icons/hicolor/256x256/apps"

          cp -a "out/${{ matrix.rid }}/." "$PKGDIR/opt/${APP_NAME}/"
          chmod 0755 "$PKGDIR/opt/${APP_NAME}/${APP_NAME}" || true

          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec /opt/%s/%s "$@"\n' \
            "$APP_NAME" "$APP_NAME" \
            > "$PKGDIR/usr/bin/$NAME"
          chmod 0755 "$PKGDIR/usr/bin/$NAME"

          printf '[Desktop Entry]\nType=Application\nName=JingleBox2\nComment=Audio pad launcher\nExec=/usr/bin/%s\nIcon=%s\nTerminal=false\nCategories=Audio;AudioVideo;\n' \
            "$NAME" "$NAME" \
            > "$PKGDIR/usr/share/applications/$NAME.desktop"

          if [ -f packaging/fedora/icons/jinglebox2.png ]; then
            cp -a packaging/fedora/icons/jinglebox2.png \
              "$PKGDIR/usr/share/icons/hicolor/256x256/apps/$NAME.png"
          fi

          INSTALLED_SIZE="$(du -sk "$PKGDIR/opt/${APP_NAME}" | awk '{print $1}')"

          printf 'Package: %s\nVersion: %s\nSection: sound\nPriority: optional\nArchitecture: %s\nMaintainer: JingleBox2 CI <noreply@github.com>\nInstalled-Size: %s\nDescription: JingleBox2\n Lightweight cross-platform audio pad launcher built with .NET and Avalonia UI.\n' \
            "$NAME" "$VER" "$ARCH" "$INSTALLED_SIZE" \
            > "$PKGDIR/DEBIAN/control"

          mkdir -p dist
          fakeroot dpkg-deb --build "$PKGDIR" "dist/${NAME}_${VER}_${ARCH}.deb"
          ls -la dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-deb-${{ matrix.deb_arch }}
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: [build, rpm_fedora, deb_ubuntu]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -maxdepth 8 -type f -exec cp -v "{}" dist/ \;
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
