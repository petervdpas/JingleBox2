name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: JingleBox2
  CONFIGURATION: Release
  PROJECT_PATH: ./JingleBox2.csproj
  DEB_PKG_NAME: jinglebox2

jobs:
  # Before anything is packaged. A release is the one build nobody gets to take back, so the
  # tests run first and everything that makes an artefact waits on them.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install ALSA runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libasound2-dev

      - name: Restore
        run: dotnet restore JingleBox2.sln

      - name: Test
        run: dotnet test Tests/JingleBox2.Tests.csproj -c Debug --logger "trx;LogFileName=results.trx"

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  build:
    name: Build & Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64

          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

          - name: linux-arm64
            os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Ensure ALSA runtime is present on Ubuntu runners (24.04 uses libasound2t64)
      - name: Install ALSA runtime (Linux runners)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libasound2-dev

      - name: Restore
        run: dotnet restore

      - name: Publish (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish $env:PROJECT_PATH `
            -c $env:CONFIGURATION `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:Version=$ver `
            -o "out/${{ matrix.name }}"

      - name: Verify bass.dll exists (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Write-Host "Publish output:"
          Get-ChildItem "out\${{ matrix.name }}" | Select-Object Name,Length | Format-Table -AutoSize
          $p = "out\${{ matrix.name }}\bass.dll"
          if (!(Test-Path $p)) { throw "bass.dll missing at $p" }
          Write-Host "OK: bass.dll present"
          $p2 = "out\${{ matrix.name }}\bass_aac.dll"
          if (!(Test-Path $p2)) { Write-Host "WARNING: bass_aac.dll missing (AAC streams won't work)" }
          else { Write-Host "OK: bass_aac.dll present" }
          # RECORD's monitor entries come from this one. It is in native/win-x64, so its absence
          # here is the copy having gone wrong rather than a build without the feature.
          $p3 = "out\${{ matrix.name }}\basswasapi.dll"
          if (!(Test-Path $p3)) { throw "basswasapi.dll missing at $p3 (RECORD would have no monitors)" }
          Write-Host "OK: basswasapi.dll present"
          # ASIO is the low-latency output. Optional in the same way bass_aac is: without it the
          # output list has no drivers in it and SETTINGS says why, which is a smaller feature set
          # rather than a break. It is copied by its own line in the csproj, and a copy target that
          # names each file one by one is exactly the kind that gets a new file forgotten.
          $p4 = "out\${{ matrix.name }}\bassasio.dll"
          if (!(Test-Path $p4)) { Write-Host "WARNING: bassasio.dll missing (no ASIO output)" }
          else { Write-Host "OK: bassasio.dll present" }
          $p5 = "out\${{ matrix.name }}\bassmix.dll"
          if (!(Test-Path $p5)) { throw "bassmix.dll missing: nothing would be summed into one output" }
          else { Write-Host "OK: bassmix.dll present" }

      - name: Publish (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:Version="$VER" \
            -o "out/${{ matrix.name }}"

      - name: Fix Linux payload (BASS + remove .NET lttng tracepoints)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.name }}"
          bash .github/scripts/linux-natives.sh "$OUT" "${{ matrix.rid }}"
          test -f "$OUT/${APP_NAME}"

      - name: Verify the rack is packaged (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.name }}"
          bash .github/scripts/verify-rack.sh "$OUT"

      - name: Verify the rack is packaged (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          # Both worlds live under rack/, rack\machines and rack\effects. This counted a
          # machines\ folder at the top of the tree, which is where all of it lived until the
          # split, and went on counting a folder nobody had moved anything into: nought against
          # nought, which the guard below reads as the check itself being broken. That guard is
          # the only reason the rename did not ship a release with an empty rack in it.
          $out = "out\${{ matrix.name }}"
          $expJson = @(Get-ChildItem -Recurse -File -Path "rack" -Filter *.json).Count
          $expWav  = @(Get-ChildItem -Recurse -File -Path "rack" -Filter *.wav).Count
          $actJson = 0
          $actWav  = 0
          if (Test-Path "$out\rack") {
            $actJson = @(Get-ChildItem -Recurse -File -Path "$out\rack" -Filter *.json).Count
            $actWav  = @(Get-ChildItem -Recurse -File -Path "$out\rack" -Filter *.wav).Count
          }
          Write-Host "rack: $actJson/$expJson json, $actWav/$expWav wav"
          if ($expJson -eq 0) { throw "Nothing on the rack in the source tree; the check itself is broken" }
          if ($actJson -ne $expJson -or $actWav -ne $expWav) {
            Get-ChildItem -Recurse -File -Path "$out\rack" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "The rack is missing from $out\rack"
          }
          Write-Host "OK: the rack is present"

      - name: Install Inno Setup
        if: startsWith(matrix.os, 'windows')
        run: choco install innosetup -y

      - name: Build installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          iscc /DAppVersion=$version installer/windows/JingleBox2.iss

      - name: Create tar.gz (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          cd "out/${{ matrix.name }}"
          tar -czf "../../${APP_NAME}-${{ matrix.name }}.tar.gz" .
          cd ../..

      - name: Create zip (Windows portable)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          Compress-Archive -Path "out\${{ matrix.name }}\*" -DestinationPath "$env:APP_NAME-${{ matrix.name }}.zip"

      - name: Upload artifacts (Windows)
        if: startsWith(matrix.rid, 'win')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-windows-x64.zip
            installer/windows/output/*.exe

      - name: Upload artifacts (Linux)
        if: startsWith(matrix.rid, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            JingleBox2-${{ matrix.name }}.tar.gz

  rpm_fedora:
    name: Fedora RPM (x64, Fedora ${{ matrix.fedora }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    container:
      image: fedora:${{ matrix.fedora }}

    steps:
      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install ca-certificates git rpm-build rpmdevtools tar gzip findutils sed grep coreutils
          # ALSA runtime + devel so managed-midi finds libasound.so
          dnf -y install alsa-lib alsa-lib-devel
          update-ca-trust || true
          dnf -y install dotnet-sdk-10.0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish (linux-x64 self-contained, NOT single-file)
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:Version="$VER" \
            -o out/linux-x64

      - name: Fix Fedora payload (BASS + remove .NET lttng tracepoints)
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/linux-natives.sh out/linux-x64 linux-x64
          test -f out/linux-x64/JingleBox2

      - name: Verify the rack is packaged
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/verify-rack.sh out/linux-x64

      - name: Prepare RPM sources (patch spec Version + create matching Source0)
        shell: bash
        run: |
          set -euo pipefail

          VER="${GITHUB_REF_NAME#v}"
          RPMTOP="/github/home/rpmbuild"

          mkdir -p "$RPMTOP"
          rpmdev-setuptree

          cp -a packaging/fedora/jinglebox2.spec "$RPMTOP/SPECS/jinglebox2.spec"
          sed -i -E "s/^Version:[[:space:]]*.*/Version:        ${VER}/" "$RPMTOP/SPECS/jinglebox2.spec"

          NAME="$(awk '/^Name:[[:space:]]*/{print $2; exit}' "$RPMTOP/SPECS/jinglebox2.spec")"
          if [ -z "${NAME:-}" ]; then
            echo "ERROR: Could not parse Name: from spec"
            exit 1
          fi

          PKGROOT="${NAME}-${VER}"
          TARBALL="${NAME}-${VER}.tar.gz"

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$PKGROOT/payload"
          mkdir -p "$STAGE/$PKGROOT/packaging/fedora/icons"

          cp -a out/linux-x64/. "$STAGE/$PKGROOT/payload/"
          cp -a packaging/fedora/jinglebox2.sh "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/jinglebox2.desktop "$STAGE/$PKGROOT/packaging/fedora/"
          cp -a packaging/fedora/icons/jinglebox2.png "$STAGE/$PKGROOT/packaging/fedora/icons/"
          cp -a LICENSE "$STAGE/$PKGROOT/" || true

          tar -C "$STAGE" -czf "$RPMTOP/SOURCES/$TARBALL" "$PKGROOT"

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          RPMTOP="/github/home/rpmbuild"
          rpmbuild -ba "$RPMTOP/SPECS/jinglebox2.spec" --define "_topdir ${RPMTOP}"

      # Every Fedora here, not the newest one by name. The tracepoint provider is removed
      # from the payload unconditionally a few steps up, so the check belongs on every build
      # that fix is applied to. Named after one release it becomes a check that silently stops
      # covering the version most likely to need it: the next one, which is the one that drops
      # the old liblttng-ust from its repositories.
      - name: Sanity-check RPM dependencies (must not require liblttng-ust.so.0)
        shell: bash
        run: |
          set -euo pipefail

          if rpm -qpR /github/home/rpmbuild/RPMS/*/*.rpm | grep -q 'liblttng-ust\.so\.0'; then
            echo "ERROR: the Fedora ${{ matrix.fedora }} RPM still requires liblttng-ust.so.0"
            exit 1
          fi

      - name: Verify the rack inside the RPM
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(find rack -type f \( -name '*.json' -o -name '*.wav' \) | wc -l | tr -d '[:space:]')"
          ACTUAL="$(rpm -qpl /github/home/rpmbuild/RPMS/*/*.rpm | grep -c '^/opt/JingleBox2/rack/.*\.\(json\|wav\)$' || true)"
          echo "rack in RPM: $ACTUAL/$EXPECTED"
          if [ "$EXPECTED" -eq 0 ]; then
            echo "ERROR: nothing on the rack in the source tree; the check itself is broken"
            exit 1
          fi
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ERROR: the RPM does not carry every file on the rack"
            exit 1
          fi

      - name: Collect RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find /github/home/rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-fedora${{ matrix.fedora }}-rpm-x64
          path: dist/*.rpm

  deb:
    name: Debian package (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The desktop one, for Debian and Ubuntu.
          - rid: linux-x64
            arch: amd64

          # And the Raspberry Pi, which is a 64 bit Debian and is packaged by the same script
          # from the same payload rules. Cross published from the x64 runner: a self contained
          # publish for another runtime lays that runtime's files out and compiles nothing for
          # it, and the only native thing this program carries is BASS, which is in the tree for
          # aarch64 already. Nothing else in the package is architecture specific, which is why
          # this is a row in a matrix rather than a job of its own.
          #
          # arm64 alone, deliberately: the 32 bit Raspberry Pi OS would need a BASS build this
          # repository does not carry, and a package that installs on it and cannot open the
          # audio library is worse than no package.
          - rid: linux-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install packaging tools (+ ALSA runtime)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg dpkg-dev fakeroot tar gzip file \
            libasound2t64 libasound2-dev

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish (${{ matrix.rid }} self-contained, not single-file)
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=false \
            -p:Version="$VER" \
            -o "out/${{ matrix.rid }}"

      - name: Fix DEB payload (BASS + remove .NET lttng tracepoints)
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.rid }}"
          bash .github/scripts/linux-natives.sh "$OUT" "${{ matrix.rid }}"
          test -f "$OUT/${APP_NAME}"

      - name: Verify the rack is packaged
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/verify-rack.sh "out/${{ matrix.rid }}"

      # The tree, the launcher, the desktop entry, the control file, and the two checks on what
      # came out: one script, so the Pi's package cannot drift from the desktop's.
      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          bash .github/scripts/build-deb.sh "out/${{ matrix.rid }}" "${{ matrix.rid }}" "$VER"
          ls -la dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-deb-${{ matrix.arch }}
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: [build, rpm_fedora, deb]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -maxdepth 8 -type f -exec cp -v "{}" dist/ \;
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
